<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden – Die Silvanas</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0a0a12;color:#f4f2ee;
  font-family:'Outfit',system-ui,sans-serif;display:flex;align-items:center;
  justify-content:center;padding:32px;text-align:center}
.box{max-width:560px}
img{width:200px;margin-bottom:40px}
h1{font-family:'Anton',Impact,sans-serif;font-size:clamp(30px,7vw,46px);
  line-height:1.1;text-transform:uppercase;
  background:linear-gradient(90deg,#ff2e63 0%,#ff7038 52%,#ffb03a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
p{margin-top:22px;color:#a7a3b3;font-size:17px;line-height:1.6}
a.btn{display:inline-block;margin-top:34px;padding:16px 38px;border-radius:999px;
  background:linear-gradient(90deg,#ff2e63 0%,#ff7038 52%,#ffb03a 100%);
  color:#fff;font-weight:700;text-decoration:none;font-size:17px}
</style>
</head>
<body>
  <div class="box">
    <img src="/logo-original.png" alt="Die Silvanas">
    <h1>Diese Seite gibt es nicht mehr</h1>
    <p>Vielleicht hast du einen alten Link erwischt. Alles Aktuelle —
       Termine, Musik und Kontakt — findest du auf unserer Startseite.</p>
    <a class="btn" href="/">Zur Startseite</a>
  </div>
</body>
</html>
